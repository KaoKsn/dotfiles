background #000000
foreground #ffffff

cursor #00ff00

background_opacity 0.75
dynamic_background_opacity yes

background_blur 25

# Cursor settings for visibility
cursor_text_color #000000

# Selection colors for better visibility
selection_foreground #000000
selection_background #ffffff
# font_family	JetBrains Mono Nerd Font
font_size 21.5
cursor_shape beam
cursor_trail 0
window_margin_width 5.00
confirm_os_window_close 0
shell bash

# Copy
map ctrl+c    copy_or_interrupt


# BEGIN_KITTY_FONTS
font_family      family="ComicShannsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
