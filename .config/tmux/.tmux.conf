# Options and general features.
# Reset the prefix key to use home row keys.
set-option -g prefix C-j

# Config reload keybind.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Enabling mouse to resize and move been panes and windows.
set -g mouse on

# Keybind for window rotation.
bind-key * rotate-window \; display-message "Windows rotated!"

# Split windows
bind-key h split-window
bind-key v split-window -h

# Switching between windows (shift + left/right arrow)
bind -n S-Left previous-window
bind -n S-Right next-window

# swap windows
bind-key -n C-S-Left swap-window -t -2
bind-key -n C-S-Right swap-window -t +1

# Use alt-(vim keybinds) to move around panes.
bind -r H resize-pane -L 1
bind -r J resize-pane -R 1
bind -r K resize-pane -U 1
bind -r J resize-pane -D 1

# Resizing panes (asef)
bind-key e select-pane -U
bind-key d select-pane -D
bind-key a select-pane -L
bind-key f select-pane -R

# Toggle pane synchronization.
bind-key y set-window-option synchronize-panes \; display-message "Pane Synchronization Toggled!"

# Styling
# Window
set-window-option -g window-status-current-style bold,fg=darkgreen
set-window-option -g window-status-style fg=black
#set-option -g window-status-activity-style fg=black
set-option -g message-style bg=pink,fg=black
set-option -g pane-border-style fg=orange
set-option -g pane-active-border-style fg=red

# Status bar
set -g status-justify centre
set -g status-bg violet
set -g status-fg blue
set -g status-interval 1
set -g status-left-length 50
set -g status-right '#[bg=colour35] 🕛 #[fg=color234,bold]%H:%M:%S'
